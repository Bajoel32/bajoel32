name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Turunkan URL API Supabase
        # SUPABASE_FUNCTIONS_URL adalah repo *variable* (bukan secret) -- URL ini
        # tidak rahasia. Kalau belum diisi, JANGAN tulis "${{ vars.SUPABASE_FUNCTIONS_URL }}/gallery"
        # langsung sebagai nilai env: itu jadi string "/gallery" yang truthy dan
        # bikin fetch ke URL relatif. Guard di shell supaya keempat VITE_*_API
        # ikut kosong saat variabelnya kosong, dan build tetap sukses (jatuh ke data statis).
        run: |
          if [ -n "${{ vars.SUPABASE_FUNCTIONS_URL }}" ]; then
            BASE="${{ vars.SUPABASE_FUNCTIONS_URL }}"
            echo "VITE_GALLERY_API=$BASE/gallery" >> "$GITHUB_ENV"
            echo "VITE_BOOKINGS_API=$BASE/bookings" >> "$GITHUB_ENV"
            echo "VITE_CONSULT_API=$BASE/consult" >> "$GITHUB_ENV"
            echo "VITE_ORDERS_API=$BASE" >> "$GITHUB_ENV"
          fi

      - run: npm run build
        env:
          # Hash SHA-256 (hex) passphrase gerbang "Tim Sales" di halaman Galeri.
          # Set di repo: Settings -> Secrets and variables -> Actions -> New repository secret.
          # Kosong -> pakai default di kode (hash dari "sales-demo").
          VITE_SALES_PASSPHRASE_SHA256: ${{ secrets.VITE_SALES_PASSPHRASE_SHA256 }}
          # Diturunkan dari SUPABASE_FUNCTIONS_URL di step sebelumnya; kosong bila
          # variabel repo belum diisi (env context yang belum diset = string kosong).
          VITE_GALLERY_API: ${{ env.VITE_GALLERY_API }}
          VITE_BOOKINGS_API: ${{ env.VITE_BOOKINGS_API }}
          VITE_CONSULT_API: ${{ env.VITE_CONSULT_API }}
          VITE_ORDERS_API: ${{ env.VITE_ORDERS_API }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
